name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets
      - run: cargo test --all
      - run: cargo build --release
      - run: |
          ./target/release/romit run examples/beginner/hello.rmt
          for f in examples/beginner/*.rmt; do
            case "$f" in
              */hello.rmt) continue ;;
            esac
            ./target/release/romit test "$f"
          done
      - run: cargo install wasm-bindgen-cli --locked
      - run: ./scripts/build_wasm.sh /tmp/romit-wasm-pkg
      - run: test -f /tmp/romit-wasm-pkg/romit_wasm_bg.wasm

  install-script-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck install.sh
      - run: ./scripts/test_install.sh

  install-script-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install shellcheck
        run: brew install shellcheck
      - run: shellcheck install.sh
      - run: ./scripts/test_install.sh

  mdbook-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install mdbook wasm-bindgen-cli --locked
      - run: ./scripts/build_site.sh
      - run: SKIP_SITE_BUILD=1 ./scripts/verify_site.sh
